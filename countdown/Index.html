<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
:root{--bg:rgba(255,255,255,.96);--text:#111;--border:rgba(0,0,0,.08);--shadow:0 12px 32px rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:10px}
.widget{width:min(100%,760px);min-height:104px;display:flex;align-items:center;justify-content:center;padding:24px 28px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.line{width:100%;text-align:center;font-size:clamp(22px,4.8vw,40px);font-weight:700;letter-spacing:-.04em;line-height:1.2;overflow-wrap:anywhere}
.number{font-variant-numeric:tabular-nums}
@media(max-width:480px){.widget{min-height:94px;padding:20px;border-radius:20px}.line{font-size:24px}}
@media(prefers-color-scheme:dark){:root{--bg:rgba(28,28,30,.96);--text:#f5f5f7;--border:rgba(255,255,255,.10);--shadow:0 12px 32px rgba(0,0,0,.28)}}
</style>
</head>
<body>
<main class="widget"><div class="line" aria-live="polite">
<span id="icon"></span><span id="event"></span><span> : </span><span id="days" class="number"></span><span id="unit"></span>
</div></main>
<script>
const p=new URLSearchParams(location.search);
const icon=p.get("icon")||"✈️";
const eventName=p.get("event")||"Japan Trip";
const dateText=p.get("date")||"2026-08-20";
const iconEl=document.getElementById("icon"),eventEl=document.getElementById("event"),daysEl=document.getElementById("days"),unitEl=document.getElementById("unit");
function update(){
 const today=new Date(); today.setHours(0,0,0,0);
 const target=new Date(dateText+"T00:00:00");
 iconEl.textContent=icon?icon+" ":"";
 eventEl.textContent=eventName;
 if(Number.isNaN(target.getTime())){daysEl.textContent="Invalid date";unitEl.textContent="";return}
 const d=Math.ceil((target-today)/86400000);
 if(d>0){daysEl.textContent=d;unitEl.textContent=d===1?" day":" days"}
 else if(d===0){daysEl.textContent="Today";unitEl.textContent=""}
 else{const n=Math.abs(d);daysEl.textContent=n;unitEl.textContent=n===1?" day ago":" days ago"}
}
update();setInterval(update,60000);
</script>
</body>
</html>
